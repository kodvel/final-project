[project]
name = "final-project-api"
version = "0.0.0"
description = "FastAPI backend for the final project foundation template."
requires-python = "==3.13.*"
dependencies = [
  "alembic==1.18.4",
  "chromadb>=0.6,<1.0",
  "chonkie==1.6.5",
  "fastapi==0.136.1",
  "litellm==1.83.14",
  "mistralai @ https://files.pythonhosted.org/packages/1b/48/2c5c4f853dec32a625c1a3d23809b80cf2e135c3441fe1764f72910dfea9/mistralai-2.4.5-py3-none-any.whl#sha256=bf3b6550258ab16dec8547b90e9c18bebf9099f55b7fc25a884bf0bbeffced0f",
  "openai==2.24.0",
  "openai-agents[litellm]==0.6.3",
  "pydantic-settings==2.14.0",
  "python-multipart==0.0.27",
  "scalar-fastapi==1.8.2",
  "sqlmodel==0.0.38",
  "tavily-python==0.7.13",
  "uvicorn[standard]==0.46.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.0.3",
  "ruff==0.15.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 150
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
exclude = ["alembic"]
